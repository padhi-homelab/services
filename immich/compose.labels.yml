services:
  immich:
    labels:
    - "traefik.enable=true"
    - "traefik.http.services.${IMMICH_TRAEFIK_NAMESPACE:?}.loadBalancer.server.port=2283"
    #
    # FIXME: Serve over a basepath
    #
    - "traefik.http.routers.${IMMICH_TRAEFIK_NAMESPACE:?}.rule=Host(`${SERVER_WAN_FQDN:?}`)"
    - "traefik.http.routers.${IMMICH_TRAEFIK_NAMESPACE:?}.entryPoints=wan-https-service-exclusive"
